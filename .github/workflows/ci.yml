name: TradeShark CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://tradeshark:tradeshark@localhost:5432/tradeshark
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tradeshark
          POSTGRES_PASSWORD: tradeshark
          POSTGRES_DB: tradeshark
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tradeshark -d tradeshark"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      DATABASE_URL: postgresql://tradeshark:tradeshark@localhost:5432/tradeshark

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Initialize PostgreSQL schema from migrations
        run: pnpm --filter @tradeshark/database db:migrate

      - name: Verify migrations are idempotent
        run: pnpm --filter @tradeshark/database db:migrate

      - name: Run PostgreSQL database integration tests
        run: pnpm --filter @tradeshark/database test

      - name: Run PostgreSQL wallet integration tests
        run: pnpm --filter @tradeshark/wallet test

      - name: Run PostgreSQL trading integration tests
        run: pnpm --filter @tradeshark/trading test
